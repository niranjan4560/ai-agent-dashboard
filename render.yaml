# Render Blueprint — https://render.com/docs/blueprint-spec
# One web service serves both the API and the dashboard UI.
# Database: a free Neon PostgreSQL instance (Render's free Postgres expires
# after 30 days). Paste its connection string into DATABASE_URL.
services:
  - type: web
    name: aria-dashboard
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render creates a random value once
      - key: DATABASE_URL
        sync: false                  # prompted for during Blueprint setup
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CHAT_RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: GITHUB_USERNAME
        sync: false
      - key: GITHUB_TOKEN
        sync: false
